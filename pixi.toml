[workspace]
authors = ["Ethan Wu"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "Strata"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
mojo = ">=1.0.0"
python = ">=3.10"
numpy = "*"
scipy = "*"

[tasks]
build = "mojo precompile strata -o strata.mojoc"
test-matrix = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_matrix.mojo"
test-linalg = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_linalg_advanced.mojo"
test-sparse = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_sparse.mojo"
test-math = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_math_and_random.mojo"
test-dataset = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_dataset.mojo"
test-pipelines = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_pipelines.mojo"
test-core = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_traits_and_errors.mojo"
test-interop = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_interop.mojo"
test-view = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_view.mojo"
test-large = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_large_matrix.mojo"
test-preprocessing = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_preprocessing.mojo"
test-split = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_model_selection.mojo"
test-all = { depends-on = ["test-matrix", "test-linalg", "test-sparse", "test-math", "test-dataset", "test-pipelines", "test-core", "test-view", "test-interop", "test-large", "test-preprocessing", "test-split"] }
test = "find tests -name 'test_*.mojo' -exec mojo -I . {} \\;"
format = "mojo format strata tests"

