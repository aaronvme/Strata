[workspace]
authors = ["Ethan Wu"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "Strata"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
mojo = ">=1.0.0"

[tasks]
build = "mojo precompile strata -o strata.mojopkg"
test-matrix = "mojo run -I . tests/test_matrix.mojo"
test-core = "mojo run -I . tests/test_traits_and_errors.mojo"

