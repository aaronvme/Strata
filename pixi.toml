[workspace]
authors = ["Ethan Wu"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "Strata"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
mojo = ">=1.0.0"
python = ">=3.10"
numpy = "*"
scipy = "*"

[tasks]
build = "mojo precompile strata -o strata.mojoc"
test-matrix = "mojo run -I . tests/test_matrix.mojo"
test-linalg = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_linalg_advanced.mojo"
test-sparse = "mojo run -I . tests/test_sparse.mojo"
test-math = "mojo run -I . tests/test_math_and_random.mojo"
test-dataset = "mojo run -I . tests/test_dataset.mojo"
test-pipelines = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_pipelines.mojo"
test-core = "mojo run -I . tests/test_traits_and_errors.mojo"
test-interop = "mojo run -I . tests/test_interop.mojo"
test-view = "mojo run -I . tests/test_view.mojo"
test-large = "mojo run -I . tests/test_large_matrix.mojo"
test-preprocessing = "mojo run -I . tests/test_preprocessing.mojo"
test-split = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_model_selection.mojo"
test-model-selection = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_model_selection.mojo"
test-metrics = "mojo run -I . tests/test_metrics.mojo"
test-linear-regression = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_linear_regression.mojo"
test-ridge = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_ridge.mojo"
test-logistic-regression = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_logistic_regression.mojo"
test-decomposition = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_decomposition.mojo"
test-pca = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_decomposition.mojo"
test-kmeans-common = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_kmeans_common.mojo"
test-kmeans = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_kmeans.mojo"
test-minibatch-kmeans = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack tests/test_minibatch_kmeans.mojo"
test-all = { depends-on = ["test-matrix", "test-linalg", "test-sparse", "test-math", "test-dataset", "test-pipelines", "test-core", "test-view", "test-interop", "test-large", "test-preprocessing", "test-model-selection", "test-metrics", "test-linear-regression", "test-ridge", "test-logistic-regression", "test-decomposition", "test-kmeans-common", "test-kmeans", "test-minibatch-kmeans"] }
test = "find tests -name 'test_*.mojo' -exec mojo -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack {} \\;"
format = "mojo format strata tests"

